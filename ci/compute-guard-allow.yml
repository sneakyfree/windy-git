# Compute guard allow-list: code that MAY talk to an AI provider directly.
# Windy Mind is the ONLY door to AI compute (Grant, 2026-09-23). Every entry
# here is an exception to that rule and MUST say why. Paths are fnmatch globs
# relative to the repo root. Owner of this file: Windy Git lane (13); changes
# go through the orchestrator. EVERY entry needs `exemption` (local-user-hardware | owner-approved |
# compute-door | guard-self) and `expires` (YYYY-MM-DD): nothing gets permanent amnesty (Mind 10-02);
# non-structural exemptions also need approved_by (windy-hub | windy-mind; a lane never approves its own)
# and expire within 90 days; an expired entry stops excusing code on that date and shows in the guard report. Source of the first entries: COMPUTE_BYPASS_AUDIT.md.
allow:
  - repo: windy-mind
    paths: ["*"]
    reason: "Windy Mind IS the door: provider clients belong here by definition."
    exemption: compute-door
    expires: 2027-10-02

  - repo: windy-agent
    paths: ["*"]
    reason: >-
      User BYOK: self-hosted agents call providers on the USER's own keys.
      Mind stays opt-in there, or every self-hosted user's inference lands on
      Grant's bill (no-cloud-cost-liability rule; audit #7).
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-code
    paths: ["extensions/windy-ai/*"]
    reason: "User BYOK AI extension: the user's own provider keys; Mind is one opt-in provider (audit #8)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-connect
    paths: ["*writers/*"]
    reason: "Writes client configs that NAME the user's own provider env vars; makes no provider calls (audit #11)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-pro
    paths: ["src/client/desktop/*"]
    reason: >-
      User BYOK desktop client: cloud STT/translate keys come from what the USER
      enters (renderer localStorage -> electron-store; env var only for dev), and
      the CSP line allows exactly those user-keyed hosts (audit #10). The
      account-server is NOT covered: server-side calls go through Mind.
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-pro
    paths: ["src/client/web/src/pages/panels/MindPanel.jsx"]
    reason: "Validates the USER's own OpenRouter key for BYOK (audit #10); spends no house money."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-pro
    paths: ["src/client/web/src/pages/panels/MindKeychain.jsx"]
    # ONLY these two endpoints: any other openrouter.ai call in this file (e.g.
    # /api/v1/chat, i.e. inference) still flags. Orchestrator-approved 09-23.
    matches: ['openrouter\.ai/auth\?', 'openrouter\.ai/api/v1/auth/keys']
    reason: "BYOK key acquisition via OpenRouter OAuth PKCE; no inference; successor of MindPanel allow (ADR-064)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-git
    paths: ["scripts/compute_guard.py", "ci/compute-guard-allow.yml"]
    reason: "The guard's own pattern list and this file."
    exemption: guard-self
    expires: 2027-10-02

  - repo: windy-mind
    paths: ["*"]
    matches: [':11434']
    reason: "Windy Mind IS the compute door (endpoint + key); it may call Ollama. Only the Ollama port is allowed here, any provider host/SDK in Mind still flags."
    exemption: compute-door
    expires: 2027-10-02

  - repo: windy-pro
    paths: [".env.example"]
    matches: ['DEEPGRAM_API_KEY']
    reason: "Template line (name only, no value) for the existing user-own-key Deepgram feature in Word's Settings. Mind's migration removes the feature and then this line (Hub classification 10-02)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-registry
    paths: ["tools/r2-provision.sh"]
    matches: ['http://localhost:8788']
    reason: "Dev origin in an R2 bucket CORS rule, not a call to the Talk engine (Hub 10-02)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windytalk
    paths: ["engine/*", "scripts/stress/*", "scripts/veron/*"]
    matches: [':(8791|8788|8794)']
    reason: "Talk's own voice engines (server, systemd unit, stress scripts); to be placed behind Mind per Mind's audit plan. NOT compute-door: a real bypass being fixed (Hub 10-02)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windytalk
    paths: ["scripts/run-client.sh"]
    matches: [':(8791|8788|8794)']
    reason: "Dev client launcher: 127.0.0.1:8788 is an ssh -L tunnel to the dev engine ON VERON (not the user's machine), so engine-side; dev-only, not shipped. To be placed behind Mind per Mind's audit plan (Windy Talk, Hub 10-02)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windytalk
    paths: ["apps/desktop/renderer/index.html"]
    matches: [':(8791|8788|8794)']
    reason: "Display-only fallback label in the settings panel (cfg.engineUrl || default); connects to nothing. The shipped client defaults to the public engine on Veron, never local inference (Windy Talk, Hub 10-02)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-02
    expires: 2026-12-31

  - repo: windy-pro
    paths: ["services/windy-stt/*"]
    # talk-engine-port lines only (the kind regex), so a provider call added here still flags
    matches: ['(?::|%3[aA])(?:8791|8788|8794)(?![0-9])']
    reason: "Our own Talk/STT engine's deploy, install, smoke and loadtest code naming its own port; not a provider (D8 dry run 10-14)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-14
    expires: 2027-01-12

  - repo: Windy-Clone
    paths:
      - "api/app/providers/elevenlabs.py"
      - "api/app/services/connect.py"
    # BYOC only: the PERSON's own ElevenLabs key (adapter + key check), dark. voice-ai host lines only.
    matches:
      - 'api\.elevenlabs\.io'
    reason: "BYOC ElevenLabs adapter on the person's own key (dark). Operator path retired (Windy-Clone #117). Hub ruling 2026-10-21T01:51:03Z (3): scoped to the BYOC lines; ends if BYOC is removed."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-21
    expires: 2027-01-19

  - repo: windy-pro
    paths:
      - "account-server/src/legal/*"
      - "docs/legal/*"
      - "src/client/desktop/renderer/*.html"
      - "src/client/web/src/pages/legal-generated.js"
    # Legal prose that NAMES the user's own env vars (privacy policy v24: "OPENAI_API_KEY, GROQ_API_KEY or
    # DEEPGRAM_API_KEY"). Only a line naming one of those three, with no env read and no provider host
    # on it, is excused; any other kind, or a real call in these paths, still flags.
    matches:
      - '^(?!.*(?:process\.env|os\.environ|getenv|import\.meta\.env|api\.openai\.com|api\.groq\.com|api\.deepgram\.com)).*\b(?:OPENAI|GROQ|DEEPGRAM)_API_KEY\b'
    reason: "Generated legal pages (privacy v24, Grant-approved 10-17) list the user-own-key env var NAMES in prose; no call. Rewording moves the privacy/agreement hashes (Hub 10-17, windy-pro #1367)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-17
    expires: 2027-01-14

  - repo: windyword-site
    paths:
      - "src/legal/legal-generated.js"
    # Same legal prose as the windy-pro entry above, vendored byte-for-byte
    # (Word, 10-25): generated from windy-pro's legal sources, every word
    # hashed into the account-server's consent/wording registry, so a reword
    # here would be a new privacy-policy version needing Grant's typed OK and
    # an account-server deploy first -- not something to do just to quiet a
    # scanner. Only a line naming one of the three env vars, with no env
    # read and no provider host on it, is excused; a real call in this file
    # still flags.
    matches:
      - '^(?!.*(?:process\.env|os\.environ|getenv|import\.meta\.env|api\.openai\.com|api\.groq\.com|api\.deepgram\.com)).*\b(?:OPENAI|GROQ|DEEPGRAM)_API_KEY\b'
    reason: "windyword-site's legal-generated.js is windy-pro's generated privacy policy (v24, Grant-approved 10-17) vendored byte-for-byte -- the user-own-key env var NAMES in disclosure prose, no call. Word, 10-25: rewording would move the consent/wording hashes and need its own Grant OK + account-server deploy first."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-24
    expires: 2027-01-22

  - repo: windy-mind-site
    paths:
      - "contracts/menu-examples/Catalog.default.json"
      - "contracts/menu-examples/OAuthStart.openrouter.json"
      - "functions/_lib/oauth.js"
      - "test/bff.test.js"
    # The site never calls an AI provider (every AI call goes through Mind's API). These lines name
    # openrouter.ai as DATA or as a redirect-host CHECK. Only openrouter.ai lines are excused, so a
    # new provider call in the same files still flags.
    matches:
      - 'openrouter\.ai'
    reason: "No provider calls (Mind, 10-23). (1)+(2) vendored menu.v1 example DATA from Mind's contract: a catalog row's provider homepage url and an oauth/start reply fixture. (3) functions/_lib/oauth.js OAUTH_PROVIDERS = an open-redirect GUARD: checks the one-tap sign-in URL Mind returns is https on the provider's own host before sending the browser there; no API call, no key; Mind does the code exchange. (4) tests of that guard."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-23
    expires: 2027-01-21

  - repo: windy-mind-site
    paths:
      - "dev/token-mock.mjs"
    # Local dev/test stand-in for Mind's token API (127.0.0.1 only). OPENAI_API_KEY is the SDK
    # env-var NAME in a fake "setup" line pointed at api.windymind.ai with a fake wm_ key.
    matches:
      - 'OPENAI_API_KEY'
    reason: "dev mock of Mind's token API (contracts/mind-token.v1.json): the SDK env-var name in a fake setup line pointed at api.windymind.ai; no provider call, fake key (Mind, 10-23)."
    exemption: owner-approved
    approved_by: windy-hub
    approved_on: 2026-10-23
    expires: 2027-01-21
